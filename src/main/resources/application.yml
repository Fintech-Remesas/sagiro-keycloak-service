spring:
  application:
    name: iam-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/iam_db}
    username: ${DB_USERNAME:iam_user}
    password: ${DB_PASSWORD:iam_password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/remittance-thesis}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:iam-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

app:
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8081}
    realm: ${KEYCLOAK_REALM:remittance-thesis}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:iam-admin-client}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:change-me}
    backend-client-id: ${KEYCLOAK_BACKEND_CLIENT_ID:iam-backend}
  kafka:
    topics:
      customer-created: ${KAFKA_TOPIC_CUSTOMER_CREATED:customer.created}
      customer-activated: ${KAFKA_TOPIC_CUSTOMER_ACTIVATED:customer.activated}
      customer-disabled: ${KAFKA_TOPIC_CUSTOMER_DISABLED:customer.disabled}

logging:
  level:
    com.sagiro.iamservice: INFO
